<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>Watermelon</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🍉 <span>Watermelon</span></div>
  </header>

  <main id="view"></main>

  <nav class="bottomnav">
    <a href="#home" data-tab="home">🏠<span data-i18n="home"></span></a>
    <a href="#search" data-tab="search">🔍<span data-i18n="search"></span></a>
    <a href="#addons" data-tab="addons">🧩<span data-i18n="addons"></span></a>
    <a href="#settings" data-tab="settings">⚙️<span data-i18n="settings"></span></a>
  </nav>

  <!-- First-run language picker -->
  <div id="lang-overlay" class="overlay hidden">
    <div class="lang-box">
      <h2>🍉 Watermelon</h2>
      <p data-i18n="welcome"></p>
      <button class="btn big" data-set-lang="en">English</button>
      <button class="btn big" data-set-lang="hi">हिन्दी</button>
    </div>
  </div>

  <!-- Player -->
  <div id="player" class="overlay hidden">
    <div class="player-bar">
      <button id="player-close" class="btn ghost">✕</button>
      <span id="player-title"></span>
    </div>
    <video id="video" controls playsinline></video>
    <div id="player-fallback" class="fallback hidden"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/addons.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
